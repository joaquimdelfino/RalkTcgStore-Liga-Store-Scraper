<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Liga Scraper — lojas e telefones</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --bg: #0f1117;
    --card: #171a23;
    --card-2: #1e222d;
    --line: #2a2f3d;
    --txt: #e8eaf0;
    --muted: #98a0b3;
    --accent: #e63946;
    --accent-2: #ffb703;
    --ok: #2dd4a7;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f6fb; --card: #ffffff; --card-2: #f7f9fc; --line: #e3e8f0;
      --txt: #14181f; --muted: #667085;
    }
  }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--txt);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; justify-content: center; padding: 32px 20px 64px;
  }
  .wrap { width: 100%; max-width: 780px; }

  header { text-align: center; margin-bottom: 28px; }
  .logo {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted);
  }
  .ball {
    width: 20px; height: 20px; border-radius: 50%;
    background: linear-gradient(to bottom, var(--accent) 0 48%, #fff 48% 52%, var(--card) 52% 100%);
    border: 2px solid #11141b; position: relative; flex: none;
  }
  .ball::after {
    content: ""; position: absolute; inset: 0; margin: auto;
    width: 6px; height: 6px; border-radius: 50%; background: #fff; border: 2px solid #11141b;
  }
  h1 { margin: 12px 0 6px; font-size: 27px; letter-spacing: -0.02em; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }

  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  form { display: flex; gap: 10px; }
  input[type=url] {
    flex: 1; min-width: 0; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card-2); color: var(--txt);
    font-size: 14px; font-family: inherit;
  }
  input[type=url]:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  button {
    font: inherit; font-weight: 600; cursor: pointer; border-radius: 10px;
    border: 1px solid transparent; padding: 12px 20px; white-space: nowrap;
    background: var(--accent); color: #fff; transition: filter .15s, opacity .15s;
  }
  button:hover:not(:disabled) { filter: brightness(1.08); }
  button:disabled { opacity: .55; cursor: not-allowed; }
  button.ghost { background: var(--card-2); color: var(--txt); border-color: var(--line); }

  .hint { margin: 10px 2px 0; font-size: 12.5px; color: var(--muted); }

  #status { margin-top: 18px; display: none; }
  #status.on { display: block; }
  .bar { height: 6px; border-radius: 99px; background: var(--card-2); overflow: hidden; }
  .bar > i {
    display: block; height: 100%; width: 0%; border-radius: 99px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .35s ease;
  }
  .bar.indet > i { width: 35% !important; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
  #statusTxt { margin-top: 9px; font-size: 13px; color: var(--muted); }

  .err {
    margin-top: 16px; padding: 12px 14px; border-radius: 10px; font-size: 13.5px;
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
  }

  #out { margin-top: 22px; display: none; }
  #out.on { display: block; }
  .sum {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px; flex-wrap: wrap; margin-bottom: 14px;
  }
  .sum b { font-size: 15px; }
  .sum span { color: var(--muted); font-size: 13px; }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .acts button { padding: 9px 15px; font-size: 13.5px; }

  .tablewrap { border: 1px solid var(--line); border-radius: 11px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 11px 14px; text-align: left; }
  thead th {
    background: var(--card-2); font-size: 11.5px; letter-spacing: .09em;
    text-transform: uppercase; color: var(--muted); font-weight: 700;
  }
  tbody tr { border-top: 1px solid var(--line); }
  tbody tr:hover { background: var(--card-2); }
  td.tel { font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.tel a { color: var(--txt); text-decoration: none; border-bottom: 1px dotted var(--muted); }
  td.tel a:hover { color: var(--accent); }
  .none { color: var(--muted); font-style: italic; }
  .idx { color: var(--muted); width: 34px; font-variant-numeric: tabular-nums; }

  #toast {
    position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 16px);
    background: var(--ok); color: #06231b; font-weight: 600; font-size: 13.5px;
    padding: 10px 18px; border-radius: 99px; opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s;
  }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><span class="ball"></span> Liga Scraper</div>
    <h1>Lojas e telefones</h1>
    <p>Cole o link de um produto da LigaPokemon e exporte a lista em CSV ou TXT.</p>
  </header>

  <div class="card">
    <form id="form">
      <input id="url" type="url" required
             placeholder="https://www.ligapokemon.com.br/?view=prod/view&pcode=135107" />
      <button id="go" type="submit">Buscar</button>
    </form>
    <p class="hint">Cerca de 2 minutos para ~90 lojas — o site limita a velocidade das consultas.
      A primeira busca demora um pouco mais, por causa da liberação do Cloudflare.</p>

    <div id="status">
      <div class="bar" id="bar"><i></i></div>
      <div id="statusTxt"></div>
    </div>
    <div id="err" class="err" hidden></div>
  </div>

  <div id="out">
    <div class="card">
      <div class="sum">
        <b id="prod"></b>
        <span id="cnt"></span>
      </div>
      <div class="acts">
        <button class="ghost" id="csv">Baixar CSV</button>
        <button class="ghost" id="txt">Baixar TXT</button>
        <button class="ghost" id="copy">Copiar</button>
      </div>
      <div class="tablewrap">
        <table>
          <thead><tr><th class="idx">#</th><th>Loja</th><th>Telefone</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let dados = null;

function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 1900);
}

function slug(s) {
  return (s || 'lojas').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) || 'lojas';
}

function baixar(nome, conteudo, mime) {
  // BOM para o Excel em pt-BR abrir os acentos corretamente
  const blob = new Blob(['﻿' + conteudo], { type: mime + ';charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nome;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

const csvCell = (v) => /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;

function montaCsv() {
  return [['Loja', 'Telefone'], ...dados.lojas.map((l) => [l.nome, l.telefone])]
    .map((r) => r.map(csvCell).join(';')).join('\r\n');
}
function montaTxt() {
  return dados.lojas.map((l) => `${l.nome} - ${l.telefone || 'sem telefone'}`).join('\n');
}

function render(d) {
  dados = d;
  $('prod').textContent = d.produto;
  const comTel = d.lojas.length - d.semTelefone;
  $('cnt').textContent = `${d.lojas.length} lojas · ${comTel} com telefone`
    + (d.semTelefone ? ` · ${d.semTelefone} sem` : '');

  $('rows').innerHTML = d.lojas.map((l, i) => {
    const tel = l.telefone
      ? `<a href="https://wa.me/55${l.telefone.replace(/\D/g, '')}" target="_blank" rel="noopener">${l.telefone}</a>`
      : '<span class="none">sem telefone</span>';
    const nome = l.nome.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    return `<tr><td class="idx">${i + 1}</td><td>${nome}</td><td class="tel">${tel}</td></tr>`;
  }).join('');

  $('out').classList.add('on');
}

$('form').addEventListener('submit', (e) => {
  e.preventDefault();
  const url = $('url').value.trim();
  if (!url) return;

  $('go').disabled = true;
  $('err').hidden = true;
  $('out').classList.remove('on');
  $('status').classList.add('on');
  $('bar').classList.add('indet');
  $('bar').querySelector('i').style.width = '0%';
  $('statusTxt').textContent = 'Iniciando…';

  const es = new EventSource('/api/scrape?url=' + encodeURIComponent(url));

  es.addEventListener('progress', (ev) => {
    const p = JSON.parse(ev.data);
    $('statusTxt').textContent = p.etapa;
    if (p.total) {
      $('bar').classList.remove('indet');
      $('bar').querySelector('i').style.width = Math.round((p.atual / p.total) * 100) + '%';
    }
  });

  es.addEventListener('done', (ev) => {
    es.close();
    $('go').disabled = false;
    $('status').classList.remove('on');
    render(JSON.parse(ev.data));
  });

  es.addEventListener('error', (ev) => {
    es.close();
    $('go').disabled = false;
    $('status').classList.remove('on');
    let msg = 'Falha na conexão com o servidor.';
    try { msg = JSON.parse(ev.data).message; } catch {}
    $('err').textContent = msg;
    $('err').hidden = false;
  });
});

$('csv').addEventListener('click', () => {
  baixar(`lojas-${slug(dados.produto)}.csv`, montaCsv(), 'text/csv');
});
$('txt').addEventListener('click', () => {
  baixar(`lojas-${slug(dados.produto)}.txt`, montaTxt(), 'text/plain');
});
$('copy').addEventListener('click', async () => {
  await navigator.clipboard.writeText(montaTxt());
  toast('Lista copiada');
});
</script>
</body>
</html>
